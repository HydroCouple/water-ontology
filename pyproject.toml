[project]
name = "water-ontology"
version = "0.1.0"
description = "Water systems ontology: LinkML source of truth, generated OWL/SHACL/Delta DDL/Unity Catalog metadata."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "linkml>=1.8",
    "linkml-runtime>=1.8",
    "pyshacl>=0.26",
    "rdflib>=7.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
engine = ["openswmm>=6.0.0a4.dev2"]
dev = ["pytest>=8.0", "sqlglot>=25"]
docs = ["mkdocs-material>=9.5", "pymdown-extensions>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["generators"]
