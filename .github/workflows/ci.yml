name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HydroCouple/openswmm.engine
          path: openswmm.engine
          sparse-checkout: python/openswmm/engine/catalog.json
      - uses: actions/checkout@v4
        with:
          repository: HydroCouple/hydrocouple.platform
          path: hydrocouple.platform
          sparse-checkout: src/hydrocouple_platform/schemas/platform
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: model.yaml matches the pinned OpenSWMM catalog
        run: python -m generators.catalog_to_linkml --catalog openswmm.engine/python/openswmm/engine/catalog.json --check
      - name: analysis_platform.yaml matches the platform JSON Schemas
        run: python -m generators.platform_to_linkml --schemas hydrocouple.platform/src/hydrocouple_platform/schemas/platform --check
      - run: for f in schema/*.yaml; do linkml-lint --config .linkmllint.yaml --ignore-warnings $f || exit 1; done
      - run: CATALOG=openswmm.engine/python/openswmm/engine/catalog.json PLATFORM_SCHEMAS=hydrocouple.platform/src/hydrocouple_platform/schemas/platform pytest -q
      - run: make owl shacl sql delta ROOT=schema/wsys.yaml
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }
