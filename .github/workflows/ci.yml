name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: generated modules match the vendored OpenSWMM catalog and platform schemas
        run: make model-check platform-check
      - run: make lint
      - run: pytest -q
      - run: make owl shacl sql delta
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }
